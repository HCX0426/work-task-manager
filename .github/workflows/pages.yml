name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run regression tests
        run: |
          for f in tests/_cfg_reg.js tests/_dash_reg.js tests/_export_reg.js tests/_export_sort_dep_reg.js tests/_export_style_fn_reg.js tests/_export_e2e_reg.js tests/_fix_ab_reg.js tests/_monthly_reg.js tests/_restore_reg.js tests/_review_reg.js; do
            echo "==> $f"
            node "$f" || exit 1
          done

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
