name: Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想要解决的问题
      description: 这个功能是为了解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望怎样实现？
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
    validations:
      required: false
